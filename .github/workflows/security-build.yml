name: Security build validation
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'scripts/**'
      - 'engine/**'
      - 'server/**'
      - 'client/**'
      - 'vendor/**'
      - '.github/workflows/security-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build server and engine candidates
        run: |
          docker build --pull --no-cache -f Dockerfile.server --build-arg VERSION=1.2.2-nsg.16 -t nexterm-server:security .
          docker build --pull --no-cache -f Dockerfile.engine --build-arg VERSION=1.2.2-nsg.16 -t nexterm-engine:security .
          docker build --no-cache -f Dockerfile --build-arg SERVER_IMAGE=nexterm-server:security --build-arg ENGINE_IMAGE=nexterm-engine:security -t nexterm-aio:security .
      - name: Validate runtime and native modules
        run: |
          sh scripts/verify-server-image.sh nexterm-server:security
          docker run --rm --entrypoint node nexterm-aio:security -e 'if (process.version !== "v26.13.0") process.exit(1); console.log(process.version, process.versions.brotli)'
          docker run --rm --entrypoint sh nexterm-aio:security -c 'apk info -e "brotli-libs>=1.1.1-r0" && ldd /usr/local/bin/nexterm-engine && /usr/local/bin/nexterm-engine --help'
  native-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify native engine archive
        run: |
          sed -i 's/^#define NEXTERM_ENGINE_VERSION ".*"/#define NEXTERM_ENGINE_VERSION "1.2.2-nsg.16"/' engine/src/proto/control_plane.h
          docker run --rm -v "$PWD":/work -w /work -e ARCH=x64 debian:bookworm-slim sh scripts/build-engine-release.sh all
          sudo chown -R "$(id -u):$(id -g)" dist
          tar -tzf dist/nexterm-engine-linux-x64.tar.gz | grep 'libbrotlidec.so.1'
          sha256sum dist/nexterm-engine-linux-x64.tar.gz > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-engine-linux-x64
          path: |
            dist/nexterm-engine-linux-x64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
